[project]
name = "human-groove-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "mido==1.3.3",
  "numpy==2.3.2",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1", "ruff==0.12.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
